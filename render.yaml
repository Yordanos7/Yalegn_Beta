# Render Blueprint for Backend
services:
  - type: web
    name: my-better-t-app-backend
    env: node
    plan: starter
    buildCommand: |
      npm ci --include=dev
      DATABASE_URL="postgresql://postgres:QEtIwdgA1qZe4e0s@db.gvnyuwhbfjscwjaxjfuy.supabase.co:5432/postgres" npx turbo db:generate --filter=@my-better-t-app/db
      npx turbo build --filter=server
    startCommand: |
      cd apps/server
      npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        value: postgresql://postgres:QEtIwdgA1qZe4e0s@db.gvnyuwhbfjscwjaxjfuy.supabase.co:5432/postgres
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        value: https://my-better-t-app-backend.onrender.com
      - key: CORS_ORIGIN
        value: https://my-better-t-app-frontend.onrender.com
    healthCheckPath: /
