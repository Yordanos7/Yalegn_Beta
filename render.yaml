# Render Blueprint for Backend
services:
  - type: web
    name: my-better-t-app-backend
    env: node
    plan: starter
    buildCommand: ./build.sh
    startCommand: |
      cd apps/server
      npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        value: "postgresql://postgres.gvnyuwhbfjscwjaxjfuy:[YOUR-PASSWORD]@[YOUR-POOLER-HOSTNAME]:6543/postgres?pgbouncer=true" # Get this from Supabase Dashboard -> Project Settings -> Database -> Connection string -> Transaction mode
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        value: https://my-better-t-app-backend.onrender.com
      - key: CORS_ORIGIN
        value: https://yalegn.onrender.com
    healthCheckPath: /
